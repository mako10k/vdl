<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>vdl settings</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        --bg: #0f1419;
        --panel: #1a2332;
        --border: #2d3a4f;
        --text: #e7ecf3;
        --muted: #8b9bb4;
        --accent: #3d8bfd;
      }
      body {
        margin: 0;
        padding: 1rem 1.25rem;
        background: var(--bg);
        color: var(--text);
        min-width: 320px;
      }
      h1 {
        font-size: 1rem;
        margin: 0 0 0.75rem;
      }
      label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin: 0.6rem 0 0.25rem;
      }
      input,
      select {
        width: 100%;
        padding: 0.45rem 0.55rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
      }
      .row {
        margin-top: 1rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      button {
        border: 1px solid var(--border);
        background: #1a3a6e;
        color: #dce9ff;
        border-radius: 8px;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
      }
      #status {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .hint {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 0.75rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>vdl extension</h1>
    <label for="apiBase">API base (backend)</label>
    <input id="apiBase" type="url" spellcheck="false" />
    <label for="uiBase">Console UI base</label>
    <input id="uiBase" type="url" spellcheck="false" />
    <label for="quality">Default quality</label>
    <select id="quality">
      <option value="best">best</option>
      <option value="worst">worst</option>
      <option value="720">720</option>
      <option value="1080">1080</option>
    </select>
    <div class="row">
      <button id="save" type="button">Save</button>
      <button id="test" type="button" style="background: var(--panel); color: var(--text)">
        Test API
      </button>
      <span id="status"></span>
    </div>
    <p class="hint">
      バックエンドが <code>127.0.0.1:18765</code> で起動している前提です。<br />
      Chrome → 拡張機能 → パッケージ化されていない拡張機能を読み込む → この
      <code>extension/</code> フォルダを選択。
    </p>
    <script type="module" src="options.js"></script>
  </body>
</html>
