[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdl"
version = "0.1.0"
description = "キュー駆動の動画 DL / 索引デーモン + レジストリ・ベクトル検索 CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "m3u8>=4.0",
    "rich>=13.0",
    "click>=8.1",
    "numpy>=1.24",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
index = [
    "torch>=2.0",
    "open-clip-torch>=2.24",
    "Pillow>=10.0",
]

[project.scripts]
vdl = "vdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
